<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robiconic Digital – SEO, SEM, SMM &amp; Google Ads Agency in Dhaka</title>
<meta name="description" content="Robiconic Digital is a Dhaka-based digital marketing agency offering SEO, SEM, Social Media Marketing and Google Ads campaigns.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700;800&display=swap">
<style>
/* =====================================================
   COLORS (taken from your logo). Change here to re-theme.
   ===================================================== */
:root{
  --navy:#1a3c8e;        /* logo dark blue */
  --blue:#0c77bb;        /* logo mid blue */
  --sky:#1ea5e8;         /* logo rocket blue */
  --orange:#f8701a;      /* logo orange */
  --deep:#0f2257;        /* dark sections */
  --bg:#ffffff;
  --bg2:#f2f7fc;
  --card:#ffffff;
  --fg:#14213f;
  --muted:#58637f;
  --line:#dde6f2;
  --font:Barlow,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --head:"Barlow Semi Condensed",Barlow,system-ui,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1330;--bg2:#0f1a40;--card:#132050;--fg:#eef3ff;--muted:#a6b3d6;--line:#233468}}
:root[data-theme="dark"]{--bg:#0a1330;--bg2:#0f1a40;--card:#132050;--fg:#eef3ff;--muted:#a6b3d6;--line:#233468}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(76px + env(safe-area-inset-top,0px));height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:17px;line-height:1.6;overflow-x:hidden}
a{color:inherit;text-decoration:none}
h1,h2,h3{font-family:var(--head);line-height:1.1;margin:0}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:4px}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
nav{display:flex;align-items:center;justify-content:space-between;height:74px;gap:16px}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:50px;width:auto;display:block}
.word{font-family:var(--head);font-weight:800;font-size:1.45rem;letter-spacing:.01em;line-height:1}
.word .a{color:var(--navy)}.word .b{color:var(--orange)}
.word small{display:block;font-size:.62rem;font-weight:700;letter-spacing:.42em;color:var(--blue);margin-top:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .word .a{color:#fff}}
:root[data-theme="dark"] .word .a{color:#fff}
.menu{display:flex;gap:28px;list-style:none;margin:0;padding:0;font-weight:500;color:var(--muted)}
.menu a{padding:6px 0;border-bottom:2px solid transparent;transition:color .2s,border-color .2s}
.menu a:hover{color:var(--fg);border-color:var(--orange)}
.burger{display:none;background:none;border:0;font-size:1.8rem;color:var(--fg);cursor:pointer}
.btn{display:inline-block;background:var(--orange);color:#fff;padding:14px 28px;border-radius:10px;font:700 1rem var(--head);letter-spacing:.02em;border:2px solid var(--orange);cursor:pointer;transition:background .2s,color .2s,transform .2s}
.btn:hover{background:#e25f0c;border-color:#e25f0c}
.btn.ghost{background:transparent;color:var(--navy);border-color:var(--navy)}
.btn.ghost:hover{background:var(--navy);color:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ghost{color:#fff;border-color:#fff}}
:root[data-theme="dark"] .btn.ghost{color:#fff;border-color:#fff}

/* hero */
.hero{padding:70px 0 64px;background:linear-gradient(180deg,var(--bg2),var(--bg))}
.hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center}
.tag{display:inline-block;font-weight:600;color:var(--blue);margin-bottom:16px;padding-left:14px;border-left:4px solid var(--orange)}
h1{font-size:clamp(2.5rem,6vw,4.4rem);font-weight:800;letter-spacing:-.015em;color:var(--navy)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h1{color:#fff}}
:root[data-theme="dark"] h1{color:#fff}
h1 span{color:var(--orange)}
.lead{max-width:540px;color:var(--muted);font-size:1.15rem;margin:20px 0 30px}
.cta{display:flex;gap:14px;flex-wrap:wrap}
.hero-art{width:100%;max-width:460px;justify-self:center}
/* hero animation: bars rise, arrow draws, rocket lifts off (plays once on load) */
.bar{transform-box:fill-box;transform-origin:50% 100%;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
.bar.b1{animation-delay:.25s}.bar.b2{animation-delay:.5s}.bar.b3{animation-delay:.75s}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.arrow{stroke-dasharray:520;stroke-dashoffset:520;animation:draw 1.3s .9s ease-out forwards}
.ahead{opacity:0;animation:fade .3s 2.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.rocket{opacity:0;animation:launch 1.2s 1.6s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes launch{from{opacity:0;transform:translate(-90px,110px)}to{opacity:1;transform:none}}
.rocket-in{animation:hover 3.4s 3s ease-in-out infinite}
@keyframes hover{50%{transform:translateY(-8px)}}
.flame{transform-box:fill-box;transform-origin:50% 0;animation:flick .25s infinite alternate}
@keyframes flick{to{transform:scaleY(1.35)}}

/* stats band */
.stats{background:var(--deep);color:#fff}
.stats .wrap{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;padding-top:30px;padding-bottom:30px}
.stat{padding-left:16px;border-left:4px solid var(--orange)}
.stat:nth-child(2){border-color:var(--sky)}.stat:nth-child(3){border-color:var(--blue)}.stat:nth-child(4){border-color:#fff}
.stat b{display:block;font:800 2.3rem var(--head)}.stat span{color:#b8c6ec;font-size:.95rem}

/* sections */
section{padding:82px 0}.alt{background:var(--bg2)}
h2{font-size:clamp(2rem,4.6vw,3rem);font-weight:800;color:var(--navy);letter-spacing:-.01em}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) h2{color:#fff}}
:root[data-theme="dark"] h2{color:#fff}
.sub{color:var(--muted);max-width:560px;margin:12px 0 42px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:22px}
.svc{background:var(--card);border:1px solid var(--line);border-top:6px solid var(--c);border-radius:6px 6px 14px 14px;padding:26px 24px 28px}
.svc .ic{font-size:1.9rem;margin-bottom:12px}
.svc h3{font-size:1.5rem;color:var(--fg);margin-bottom:8px}.svc p{margin:0;color:var(--muted)}
.work{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.thumb{height:150px;display:flex;align-items:flex-end;gap:10px;padding:18px 22px;background:var(--bg2);border-bottom:1px solid var(--line)}
.thumb i{display:block;width:34px;border-radius:3px 3px 0 0;background:var(--blue)}
.thumb i:nth-child(2){background:var(--orange)}.thumb i:nth-child(3){background:var(--navy)}
.thumb em{margin-left:auto;align-self:flex-start;font:700 .9rem var(--head);color:var(--muted);font-style:normal}
.work div.body{padding:20px 22px 24px}.work h3{font-size:1.3rem;margin-bottom:6px}.work p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:0;counter-reset:s}
.step{padding:6px 24px 6px 0;position:relative}
.step::before{counter-increment:s;content:counter(s);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--navy);color:#fff;font:800 1.3rem var(--head);margin-bottom:16px;position:relative;z-index:1}
.step:nth-child(even)::before{background:var(--orange)}
.step::after{content:"";position:absolute;top:22px;left:46px;right:0;height:3px;background:var(--line)}
.step:last-child::after{display:none}
.step h3{font-size:1.35rem;margin-bottom:6px}.step p{margin:0;color:var(--muted);padding-right:10px}

/* contact */
.contact{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:start}
label{display:block;font-weight:600;font-size:.92rem;color:var(--muted);margin:16px 0 6px}
input,textarea{width:100%;padding:13px 14px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--fg);font:inherit}
input:focus,textarea:focus{outline:0;border-color:var(--orange);box-shadow:0 0 0 4px color-mix(in srgb,var(--orange) 22%,transparent)}
.info{background:var(--deep);color:#fff;border-radius:16px;padding:30px}
.info .chip{background:#fff;border-radius:12px;padding:14px;display:inline-block;margin-bottom:20px}
.info .chip img{height:120px;width:auto;display:block}
.info p{margin:10px 0;color:#d3def8}.info a:hover{color:var(--orange)}
footer{background:var(--deep);color:#a9b8e4;padding:26px 0;font-size:.95rem}
footer .wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between}
footer img{height:38px;background:#fff;border-radius:8px;padding:4px}

/* gentle section fade (once) */
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s}.rv.in{opacity:1;transform:none}

@media(max-width:820px){
  .menu,.nav-cta{display:none}.burger{display:block}
  .menu.open{display:flex;flex-direction:column;position:absolute;top:74px;left:0;right:0;background:var(--bg);padding:18px 22px;border-bottom:1px solid var(--line);gap:14px}
  .hero .wrap,.contact{grid-template-columns:1fr}.hero-art{max-width:340px}
  .step::after{display:none}.step{padding-bottom:22px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.arrow{stroke-dashoffset:0}.ahead,.rocket{opacity:1}.rv{opacity:1;transform:none}}
</style>
</head>

<header><div class="wrap"><nav>

<div class="stats"><div class="wrap" id="stats"></div></div>

<section id="services"><div class="wrap">

</div></section>

<section class="alt" id="work"><div class="wrap">
  <h2 class="rv" id="workT"></h2><p class="sub rv" id="workSub"></p>
  <div class="grid" id="work-grid"></div>
</div></section>

<section id="process"><div class="wrap">
  <h2 class="rv" id="procT"></h2><p class="sub rv" id="procSub"></p>
  <div class="steps rv" id="steps-grid"></div>
</div></section>

<section class="alt" id="contact"><div class="wrap">
  <h2 class="rv" id="contT"></h2><p class="sub rv" id="contSub"></p>
  <div class="contact">
    <div class="rv">
      <label for="n">Your name</label><input id="n" autocomplete="name">
      <label for="p">Phone or WhatsApp</label><input id="p" autocomplete="tel">
      <label for="s">Service you need</label><input id="s" placeholder="SEO, Google Ads, Social Media...">
      <label for="m">About your business</label><textarea id="m" rows="4"></textarea>
      <p style="margin-top:20px"><button class="btn" id="send" type="button">Send message</button></p>
    </div>
    <div class="info rv" id="info"></div>
  </div>
</div></section>
</main>

<footer><div class="wrap"><img id="flogo" alt="Robiconic Digital logo"><span id="foot"></span></div></footer>

const $ = id => document.getElementById(id), S = SITE;
$('brand').innerHTML = '<img src="'+LOGO_ICON+'" alt="Robiconic Digital logo"><span class="word"><span class="a">'+S.logoName[0]+'</span><span class="b">'+S.logoName[1]+'</span><small>'+S.logoName[2]+'</small></span>';
$('menu').innerHTML = S.menu.map(m => '<li><a href="'+m[1]+'">'+m[0]+'</a></li>').join('');
$('navcta').textContent = S.navButton;
$('tag').textContent = S.tag; $('h1').innerHTML = S.headline; $('lead').textContent = S.lead;
$('cta1').textContent = S.button1; $('cta2').textContent = S.button2;
$('svcT').textContent = S.servicesTitle; $('svcSub').textContent = S.servicesIntro;
$('workT').textContent = S.workTitle; $('workSub').textContent = S.workIntro;
$('procT').textContent = S.processTitle; $('procSub').textContent = S.processIntro;
$('contT').textContent = S.contactTitle; $('contSub').textContent = S.contactIntro;

$('stats').innerHTML = S.stats.map(s => '<div class="stat"><b data-n="'+s.n+'" data-s="'+s.suffix+'">0</b><span>'+s.label+'</span></div>').join('');
$('services-grid').innerHTML = S.services.map(s => '<div class="svc rv" style="--c:'+s.color+'"><div class="ic">'+s.icon+'</div><h3>'+s.title+'</h3><p>'+s.text+'</p></div>').join('');
$('work-grid').innerHTML = S.work.map((w,i) => '<div class="work rv"><div class="thumb"><i style="height:'+(40+i*12)+'px"></i><i style="height:'+(70+i*10)+'px"></i><i style="height:'+(100-i*6)+'px"></i><em>'+w.tag+'</em></div><div class="body"><h3>'+w.title+'</h3><p>'+w.text+'</p></div></div>').join('');
$('steps-grid').innerHTML = S.steps.map(s => '<div class="step"><h3>'+s.title+'</h3><p>'+s.text+'</p></div>').join('');
$('info').innerHTML = '<div class="chip"><img src="'+LOGO_FULL+'" alt="Robiconic Digital logo"></div><p>Website: <a href="https://'+S.contact.web+'">'+S.contact.web+'</a></p><p>Email: <a href="mailto:'+S.contact.email+'">'+S.contact.email+'</a></p><p>Location: '+S.contact.location+'</p>';
$('flogo').src = LOGO_ICON;
$('foot').textContent = '© ' + new Date().getFullYear() + ' Robiconic Digital. All rights reserved.';

/* stats count up when visible, sections fade in once */
function count(el){ const end=+el.dataset.n, suf=el.dataset.s; let cur=0; const step=Math.max(1,Math.ceil(end/40));
  const t=setInterval(()=>{cur=Math.min(end,cur+step);el.textContent=cur+suf;if(cur>=end)clearInterval(t)},35); }
const io = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target);} }), {threshold:.12});
document.querySelectorAll('.rv').forEach(el => io.observe(el));
const sio = new IntersectionObserver(es => es.forEach(e => { if(e.isIntersecting){ e.target.querySelectorAll('[data-n]').forEach(count); sio.unobserve(e.target);} }), {threshold:.3});
sio.observe($('stats'));

$('burger').onclick = () => $('menu').classList.toggle('open');
$('menu').onclick = () => $('menu').classList.remove('open');
$('send').onclick = () => {
  const body='Name: '+$('n').value+'\nPhone: '+$('p').value+'\nService: '+$('s').value+'\n\n'+$('m').value;
  window.location.href='mailto:'+S.contact.email+'?subject='+encodeURIComponent('New enquiry from website')+'&body='+encodeURIComponent(body);
};
</script>
